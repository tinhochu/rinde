# Coolify: create a "Docker Compose" resource pointing at this repo (Base Directory "/").
# Set POSTGRES_PASSWORD (and later META_API_KEY) in Coolify's environment variables;
# assign your domain to the `web` service on port 3000.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rinde}
      POSTGRES_DB: rinde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: migrate
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://rinde:${POSTGRES_PASSWORD:-rinde}@db:5432/rinde
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    labels:
      - coolify.exclude_from_hc=true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rinde:${POSTGRES_PASSWORD:-rinde}@db:5432/rinde
      META_API_KEY: ${META_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-https://api.meta.ai/v1}
      META_VISION_MODEL: ${META_VISION_MODEL:-muse-spark-1.3}
      DEMO_RECEIPTS: ${DEMO_RECEIPTS:-1}
      RECEIPTS_DIR: /data/receipts
      INGEST_EXITO: ${INGEST_EXITO:-1}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      # The app's and the landing page's origins, e.g. https://app.rinde.example.com,https://rinde.example.com
      # (the landing page reads the catalog for its live comparison); unset keeps the local Expo dev servers.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Email via Resend: outbound (sign-in codes, replies to forwarded invoices) needs the key and sender;
      # receiving e-invoices needs the webhook secret and inbound domain (off while either is unset).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      # The app's URL for the review link in reply emails; unset uses the first CORS origin.
      APP_URL: ${APP_URL:-}
    volumes:
      - receipts:/data/receipts
    ports:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rinde:${POSTGRES_PASSWORD:-rinde}@db:5432/rinde
      INGEST_CRON: ${INGEST_CRON:-0 5 * * *}
      INGEST_ON_START: ${INGEST_ON_START:-0}
      INGEST_EXITO: ${INGEST_EXITO:-1}
      RECEIPTS_DIR: /data/receipts
      # Retries forwarded invoice emails cut short by a web restart, through the web service.
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      WEB_INTERNAL_URL: http://web:3000
    volumes:
      # Receipt photos; the worker deletes them after 30 days.
      - receipts:/data/receipts
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The marketing page at the root domain; the app (apps/mobile/deploy) is served from the app. subdomain
  # and this page redirects the app's old paths there. Origins are baked in at build time.
  landing:
    build:
      context: apps/landing
      args:
        SITE_ORIGIN: ${SITE_ORIGIN:-https://rinde.cool.chuventures.com}
        APP_ORIGIN: ${APP_ORIGIN:-https://app.rinde.cool.chuventures.com}
        API_ORIGIN: ${API_ORIGIN:-https://rinde-api.cool.chuventures.com}
    restart: unless-stopped
    ports:
      - "80"

volumes:
  pgdata:
  receipts:
