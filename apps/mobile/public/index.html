<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app draw under the notch; screens pad themselves with safe-area insets.
         maximum-scale=1 stops iOS Safari from zooming into a focused input (pinch zoom still works there). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Compara precios de D1, Jumbo y Éxito y arma el mercado donde más te rinde la plata." />

    <!-- Installing: Android/Chrome read the manifest; iOS reads the apple-* tags. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Rinde" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#FCFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style>
      /* The app's background before the bundle paints, so the page never flashes white (see lib/theme.ts). */
      html, body { background: #FCFAF8; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #111613; } }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #111613; }
      /* Feel like an app: no grey flash on tap, no pull-to-refresh bounce of the whole page, no callout on long-press. */
      body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
      img { -webkit-touch-callout: none; }
    </style>
    <script>
      // Rinde used to live on the root domain; its landing page forwards old installs here with that
      // origin's data in the URL fragment (#rinde-handoff=, never sent to a server). Imported before the
      // app reads storage, and only into a device with no session of its own.
      try {
        var handoff = /^#rinde-handoff=([A-Za-z0-9_-]+)$/.exec(location.hash);
        if (handoff) {
          history.replaceState(null, "", location.pathname + location.search);
          if (!localStorage.getItem("rinde-session")) {
            var b64 = handoff[1].replace(/-/g, "+").replace(/_/g, "/");
            var bin = atob(b64 + "===".slice((b64.length + 3) % 4));
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            var data = JSON.parse(new TextDecoder().decode(bytes));
            Object.keys(data).forEach(function (key) {
              if (/^rinde-[a-z-]+$/.test(key) && typeof data[key] === "string") localStorage.setItem(key, data[key]);
            });
            localStorage.setItem("rinde-moved-notice", "1");
          }
        }
      } catch (e) {}
      // The theme chosen in Perfil (lib/theme-pref.web.ts), applied before first paint.
      try {
        var t = localStorage.getItem("rinde-theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute("content", t === "dark" ? "#111613" : "#FCFAF8");
            m.removeAttribute("media");
          });
        }
      } catch (e) {}
      // Chrome offers installing once, possibly before the app has mounted: keep the offer for lib/install.web.ts.
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__rindeInstall = e;
        window.dispatchEvent(new Event("rinde-installable"));
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Rinde necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
  </body>
</html>
