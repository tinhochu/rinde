<!doctype html>
<!-- Source of the link-preview images (1200×630), in the page's look. No prices: a preview can't say when they were seen.
     Regenerate: serve apps/landing, open og/og.html#es and og/og.html#en at 1200×630, screenshot to public/og-<lang>.png. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'DM Serif Display'; src: url(../src/assets/fonts/dm-serif-display.woff2) format('woff2'); }
  @font-face { font-family: 'DM Serif Display'; font-style: italic; src: url(../src/assets/fonts/dm-serif-display-italic.woff2) format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 500; src: url(../src/assets/fonts/dm-sans-500.woff2) format('woff2'); }
  @font-face { font-family: 'DM Sans'; font-weight: 700; src: url(../src/assets/fonts/dm-sans-700.woff2) format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { box-sizing: border-box; background: #f6f3ea; color: #24543c; font-family: 'DM Sans', sans-serif; display: grid; grid-template-columns: 1fr 330px; align-items: center; gap: 56px; padding: 0 88px; }
  .wordmark { font-family: 'DM Serif Display', serif; letter-spacing: -.075em; font-size: 54px; line-height: 1; }
  h1 { font-family: 'DM Serif Display', serif; font-weight: 400; letter-spacing: -.035em; font-size: 80px; line-height: 1.02; margin: 34px 0 0; }
  h1 em { display: block; color: #b6422e; }
  .stores { margin-top: 34px; font-size: 22px; font-weight: 500; color: #536153; }
  .receipt { position: relative; transform: rotate(5deg); background: #fffdf5; color: #294332; padding: 34px 32px 40px; box-shadow: 0 24px 40px rgba(36, 84, 60, .18); font-family: ui-monospace, Menlo, monospace; }
  .receipt .head { font-size: 15px; letter-spacing: .08em; padding-bottom: 18px; border-bottom: 2px dashed rgba(36, 84, 60, .3); margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; font-size: 24px; font-weight: 700; }
  .bar { height: 14px; width: 92px; background: #294332; opacity: .2; border-radius: 3px; }
  .badge { position: absolute; left: -46px; top: -46px; width: 96px; height: 96px; border-radius: 50%; background: #edce70; color: #24543c; display: grid; place-items: center; text-align: center; font: 700 13px/1.15 'DM Sans', sans-serif; transform: rotate(-17deg); }
</style>
</head>
<body>
  <div>
    <div class="wordmark">rinde ✳</div>
    <h1><span id="t1"></span><br><span id="t2"></span><em id="t3"></em></h1>
    <p class="stores" id="s"></p>
  </div>
  <div class="receipt">
    <div class="badge" id="b"></div>
    <div class="head" id="h"></div>
    <div class="row">D1<span class="bar"></span></div>
    <div class="row">Jumbo<span class="bar"></span></div>
    <div class="row">Éxito<span class="bar"></span></div>
    <div class="row">Carulla<span class="bar"></span></div>
  </div>
<script>
  const en = location.hash === "#en";
  const text = en
    ? { t: ["Same groceries.", "More money", "left over."], s: "D1, Jumbo, Éxito and Carulla, side by side.", h: "ONE PRODUCT. EVERY STORE.", b: "EVERY<br>PESO<br>COUNTS" }
    : { t: ["El mismo mercado.", "Más plata", "en tu bolsillo."], s: "D1, Jumbo, Éxito y Carulla, lado a lado.", h: "UN PRODUCTO. CADA TIENDA.", b: "CADA<br>PESO<br>CUENTA" };
  text.t.forEach((line, i) => (document.getElementById(`t${i + 1}`).textContent = line));
  document.getElementById("s").textContent = text.s;
  document.getElementById("h").textContent = text.h;
  document.getElementById("b").innerHTML = text.b;
</script>
</body>
</html>
