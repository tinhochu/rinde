# Rinde's root domain: the landing page. __APP_ORIGIN__ is filled in at build time (Dockerfile).

# Agents that ask for Markdown (Accept: text/markdown) get each page's index.md twin (prerender.mjs).
map $http_accept $markdown {
  default "";
  "~*text/markdown" ".md";
}
map $http_accept $not_found_page {
  default /404.html;
  "~*text/markdown" /404.md;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  # Redirects stay relative (/en -> /en/), whatever scheme or port the proxy in front uses.
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/markdown text/plain application/xml;
  charset utf-8;
  charset_types text/html text/plain text/markdown text/xml application/xml;

  # The app moved to its own subdomain: its old links and files follow it.
  location ~ ^/(cart|favorites|plan|profile|account|contributions|product/|receipt|search|_expo/|assets/|manifest\.json|icon-|apple-touch-icon|favicon\.ico) {
    return 301 __APP_ORIGIN__$request_uri;
  }

  # Replaces the old app's service worker; always revalidated so old installs pick it up.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Content-hashed names (Vite): cache for a year.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # "/" -> /index.md and "/about" -> /about/index.md when Markdown is asked for; otherwise the files as they are.
  # .md is not in nginx's mime.types: files served from here default to Markdown.
  location / {
    default_type text/markdown;
    try_files ${uri}index$markdown $uri/index$markdown $uri$markdown $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header Vary Accept always;
  }

  error_page 404 $not_found_page;
}
