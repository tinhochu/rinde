<svg xmlns="http://www.w3.org/2000/svg" width="760" height="246" viewBox="0 0 760 246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Same product at another store: share Muse gets right on the held-out set of 95 products</title>
<rect width="760" height="246" rx="8" fill="#0d1117"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#f0f6fc">Finding the same product at another store</text>
<text x="24" y="56" font-size="13" fill="#9198a1">Held-out set, 95 products, scored against barcodes</text>
<line x1="250" x2="250" y1="68" y2="200" stroke="#3d444d" stroke-width="1"/>
<text x="250" y="218" font-size="12" fill="#9198a1" text-anchor="middle">0 %</text>
<line x1="415" x2="415" y1="68" y2="200" stroke="#3d444d" stroke-width="1"/>
<text x="415" y="218" font-size="12" fill="#9198a1" text-anchor="middle">50 %</text>
<line x1="580" x2="580" y1="68" y2="200" stroke="#3d444d" stroke-width="1"/>
<text x="580" y="218" font-size="12" fill="#9198a1" text-anchor="middle">100 %</text>
<text x="236" y="93" font-size="14" fill="#f0f6fc" text-anchor="end">Word rule (no AI)</text>
<rect x="250" y="76" width="145.86" height="26" rx="4" fill="#4d555e"/>
<text x="405.86" y="94" font-size="14" font-weight="600" fill="#f0f6fc">44.2 %</text>
<text x="461.86" y="94" font-size="13" fill="#9198a1">0 wrong picks</text>
<text x="236" y="139" font-size="14" fill="#f0f6fc" text-anchor="end">Muse, names only</text>
<rect x="250" y="122" width="277.86" height="26" rx="4" fill="#4d555e"/>
<text x="537.86" y="140" font-size="14" font-weight="600" fill="#f0f6fc">84.2 %</text>
<text x="593.86" y="140" font-size="13" fill="#9198a1">4 wrong picks</text>
<text x="236" y="185" font-size="14" fill="#f0f6fc" text-anchor="end" font-weight="600">Muse, names + package photos</text>
<rect x="250" y="168" width="323.07000000000005" height="26" rx="4" fill="#2f9e6c"/>
<text x="583.07" y="186" font-size="14" font-weight="600" fill="#f0f6fc">97.9 %</text>
<text x="639.07" y="186" font-size="13" fill="#9198a1">0 wrong picks</text>
</svg>
